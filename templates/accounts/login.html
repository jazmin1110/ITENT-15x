{% extends 'base.html' %}

{% block title %}Login - ITENT{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="card">
      <div class="card-body p-4 p-md-5">
        <div class="auth-brand">
          <i class="bi bi-briefcase-fill"></i> ITENT
        </div>
        <p class="auth-subtitle">Mag-login sa iyong account</p>

        {% if form.errors %}
          <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i>
            Invalid na username, email, phone number, o password. Subukan ulit.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Username, Email, o Phone Number</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Ilagay ang iyong username, email, o phone number" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Ilagay ang iyong password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
        </form>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--color-border);">
          <span class="text-muted">Wala pa account?</span>
          <a href="{% url 'signup' %}" class="fw-semibold">Mag-sign up</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
