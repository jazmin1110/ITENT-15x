{% extends 'base.html' %}

{% block title %}Employer Profile - ITENT{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow">
      <div class="card-body p-4">
        <h2 class="card-title mb-4">Employer Profile</h2>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_company_name" class="form-label">Pangalan ng Company</label>
            {{ form.company_name }}
          </div>

          <div class="mb-3">
            <label for="id_city" class="form-label">Lungsod/Bayan</label>
            {{ form.city }}
          </div>

          <div class="mb-3">
            <label for="id_contact_person" class="form-label">Contact Person</label>
            {{ form.contact_person }}
          </div>

          <div class="mb-3">
            <label for="id_contact_number" class="form-label">Contact Number</label>
            {{ form.contact_number }}
          </div>

          <div class="mb-3">
            <label for="id_doc_url" class="form-label">Link ng Business Document (optional)</label>
            {{ form.doc_url }}
            <small class="text-muted">Para sa verification</small>
          </div>

          <button type="submit" class="btn btn-success btn-lg w-100">I-save ang Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
