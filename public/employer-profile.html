<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employer Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/employer.css">
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-success mb-4">
    <div class="container">
      <a class="navbar-brand" href="employer-profile.html">ITENT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#employerNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="employerNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="employer-profile.html">My Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="employer-jobs.html">My Jobs</a></li>
          <li class="nav-item"><a class="nav-link" href="post-job.html">Post Job</a></li>
        </ul>
        <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container container--medium">
    <h3 class="mb-2">Company profile</h3>
    <p class="text-muted small mb-3">Kailangan para ma-verify ang employer account.</p>

    <div class="card">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Company name <span class="text-danger">*</span></label>
          <input id="company_name" class="form-control form-control-lg" placeholder="ABC Builders" />
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">Lungsod <span class="text-danger">*</span></label>
            <input id="city" class="form-control form-control-lg" placeholder="Quezon City" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact person</label>
            <input id="contact_person" class="form-control form-control-lg" placeholder="Juan Dela Cruz" />
          </div>
        </div>

        <div class="d-grid gap-2">
          <button id="saveBtn" class="btn btn-success btn-lg" type="button">I-save</button>
        </div>

        <p id="msg" class="mt-3"></p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/employerProfile.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
