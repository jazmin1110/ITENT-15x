<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Job</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/employer.css">
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-success mb-4">
    <div class="container">
      <a class="navbar-brand" href="employer-profile.html">ITENT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#employerNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="employerNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="employer-profile.html">My Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="employer-jobs.html">My Jobs</a></li>
          <li class="nav-item"><a class="nav-link active" href="post-job.html">Post Job</a></li>
          <li class="nav-item"><a class="nav-link" href="conversations.html">Chat</a></li>
        </ul>
        <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container container--medium">
    <h3 class="mb-2">Mag-post ng trabaho</h3>
    <p class="text-muted small mb-4">3 lang ang kailangan: title, lungsod, rate.</p>

    <div class="card">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">Title ng trabaho <span class="text-danger">*</span></label>
          <input id="title" class="form-control form-control-lg" placeholder="e.g., Mason (Project-based)" />
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">Lungsod <span class="text-danger">*</span></label>
            <input id="city" class="form-control form-control-lg" placeholder="Quezon City" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Daily rate (₱)</label>
            <input id="daily_rate" type="number" class="form-control form-control-lg" placeholder="800" />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small">Start date (optional)</label>
          <input id="start_date" type="date" class="form-control" />
        </div>

        <div class="mb-4">
          <label class="form-label small">Skills needed (pindot lang)</label>
          <div class="d-flex flex-wrap gap-2">
            <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Masonry" id="s1"><label class="form-check-label" for="s1">Masonry</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Carpentry" id="s2"><label class="form-check-label" for="s2">Carpentry</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Helper" id="s3"><label class="form-check-label" for="s3">Helper</label></div>
          </div>
        </div>

        <div class="d-grid">
          <button id="postBtn" class="btn btn-success btn-lg" type="button">I-post</button>
        </div>

        <div id="msg" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/postJob.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
