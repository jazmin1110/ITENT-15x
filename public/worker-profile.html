<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worker Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/worker.css">
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="worker-profile.html">ITENT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#workerNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="workerNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="worker-profile.html">My Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="jobs.html">Browse Jobs</a></li>
        </ul>
        <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container container--narrow">
    <h3 class="mb-2">Profile ko</h3>
    <p class="text-muted small mb-4">Ilagay lang ang basic info. Mas maikli, mas mabilis.</p>

    <a href="jobs.html" class="btn btn-outline-primary mb-4 d-block text-center">Tingnan muna ang trabaho →</a>

    <div class="mb-3">
      <label class="form-label">Pangalan <span class="text-danger">*</span></label>
      <input id="full_name" class="form-control form-control-lg" placeholder="Juan Dela Cruz" />
    </div>

    <div class="mb-3">
      <label class="form-label">Lungsod <span class="text-danger">*</span></label>
      <input id="city" class="form-control form-control-lg" placeholder="Quezon City" />
    </div>

    <div class="mb-3">
      <label class="form-label">Contact</label>
      <input id="contact_number" class="form-control form-control-lg" placeholder="09XXXXXXXXX" inputmode="tel" />
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label small">Taon ng experience</label>
        <input id="years_experience" type="number" class="form-control" min="0" placeholder="3" />
      </div>
      <div class="col-6">
        <label class="form-label small">Pwedeng magsimula</label>
        <input id="availability_date" type="date" class="form-control" />
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small">Skills (pindot lang)</label>
      <div class="d-flex flex-wrap gap-2">
        <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Masonry" id="skill1"><label class="form-check-label" for="skill1">Masonry</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Carpentry" id="skill2"><label class="form-check-label" for="skill2">Carpentry</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Helper" id="skill3"><label class="form-check-label" for="skill3">Helper</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Painting" id="skill4"><label class="form-check-label" for="skill4">Painting</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input skill" type="checkbox" value="Driver" id="skill5"><label class="form-check-label" for="skill5">Driver</label></div>
      </div>
    </div>

    <div class="d-grid gap-2">
      <button id="saveBtn" type="button" class="btn btn-primary btn-lg">I-save</button>
    </div>

    <p id="msg" class="mt-3"></p>
  </div>

  <script type="module">
    import { supabase } from "./js/supabaseClient.js";

    const msg = document.getElementById("msg");

    async function requireAuth() {
      const { data } = await supabase.auth.getUser();
      if (!data?.user) window.location.href = "index.html";
      return data.user;
    }

    function getSelectedSkills() {
      return [...document.querySelectorAll(".skill:checked")].map(cb => cb.value);
    }

    function setSelectedSkills(skills) {
      document.querySelectorAll(".skill").forEach(cb => {
        cb.checked = skills?.includes(cb.value) ?? false;
      });
    }

    async function loadProfile(user) {
      const { data, error } = await supabase
        .from("worker_profiles")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) {
        msg.textContent = "Error loading profile: " + error.message;
        return;
      }

      if (!data) return; // first time user, no row yet

      full_name.value = data.full_name ?? "";
      city.value = data.city ?? "";
      contact_number.value = data.contact_number ?? "";
      years_experience.value = data.years_experience ?? "";
      availability_date.value = data.availability_date ?? "";
      setSelectedSkills(data.skills ?? []);
    }

    async function saveProfile(user) {
      msg.textContent = "Saving...";
      const payload = {
        user_id: user.id,
        full_name: full_name.value.trim(),
        city: city.value.trim(),
        contact_number: contact_number.value.trim(),
        years_experience: years_experience.value ? Number(years_experience.value) : null,
        availability_date: availability_date.value || null,
        skills: getSelectedSkills()
      };

      // basic validation
      if (!payload.full_name || !payload.city) {
        msg.textContent = "Paki-lagay ang pangalan at lungsod.";
        return;
      }

      const { error } = await supabase
        .from("worker_profiles")
        .upsert(payload);

      msg.textContent = error ? ("Save failed: " + error.message) : "Profile saved ✅";
    }

    // main
    const user = await requireAuth();
    await loadProfile(user);

    document.getElementById("saveBtn").addEventListener("click", async () => {
      await saveProfile(user);
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
