<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/worker.css">
  <link rel="stylesheet" href="css/employer.css">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-primary mb-4" id="chatNavbar">
    <div class="container">
      <a class="navbar-brand" href="#" id="navBrand">ITENT</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#chatNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="chatNav">
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container container--medium">
    <a href="javascript:history.back()" class="btn btn-link px-0 mb-2">&larr; Bumalik</a>
    <h3 class="mb-3">Messages</h3>

    <div id="msg" class="text-muted mb-2"></div>
    <div id="thread" class="border rounded p-3 mb-3" style="height: 360px; overflow:auto;"></div>

    <div class="input-group">
      <input id="text" class="form-control" placeholder="Type a message..." />
      <button id="sendBtn" class="btn btn-primary" type="button">Send</button>
    </div>

    <div id="warn" class="small text-muted mt-2"></div>
  </div>

  <script type="module" src="./js/chat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
